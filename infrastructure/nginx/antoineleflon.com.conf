server {
    listen 80;
    listen [::]:80;
    server_name antoineleflon.com www.antoineleflon.com;

    root /var/www/antoineleflon.com/current;
    index index.html;
    server_tokens off;
    autoindex off;
    # TLS ends on proxy01; never emit absolute http:// redirects.
    absolute_redirect off;

    access_log /var/log/nginx/antoineleflon.com.access.log;
    error_log /var/log/nginx/antoineleflon.com.error.log warn;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /.version {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Prerendered routes (fr/index.html, en/projects/index.html, ...) are served
    # in place so /fr never redirects to /fr/.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
